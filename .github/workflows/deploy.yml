name: Deploy to ChipFoundryServices.com

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.CFS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.CFS_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy via rsync
        run: |
          rsync -rltz \
            --no-perms --no-owner --no-group \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude '*.md' \
            --exclude '*.log' \
            --exclude 'node_modules/' \
            --exclude 'vendor/' \
            --exclude 'content/' \
            --exclude 'blog/' \
            --exclude 'new/' \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no" \
            ./website/ \
            ${{ secrets.CFS_USER }}@${{ secrets.CFS_HOST }}:${{ secrets.CFS_WEBROOT }}/

      - name: Verify deployment
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            ${{ secrets.CFS_USER }}@${{ secrets.CFS_HOST }} \
            "echo 'Deploy OK at \$(date)' && ls -lt ${{ secrets.CFS_WEBROOT }}/*.php | head -5"
