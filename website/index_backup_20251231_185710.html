    <script>
        async function ask() {
            const question = document.getElementById('question').value.trim();
            if (!question) return;
            
            // Hide the main heading and adjust container layout
            const mainHeading = document.getElementById('mainHeading');
            const mainContainer = document.getElementById('mainContainer');
            const searchWrapper = document.getElementById('searchWrapper');
            const container = document.getElementById('results');
            
            mainHeading.classList.add('hidden');
            mainContainer.classList.add('has-results');
            searchWrapper.classList.add('bottom');
            
            // Add user message
            container.innerHTML = `<div class="message user">${escapeHtml(question)}</div>`;
            container.classList.add('show');
            
            // Add typing indicator
            const typingIndicator = `<div class="typing-indicator" id="typingIndicator">
                <div class="typing-dot"></div>
            </div>`;
            container.innerHTML += typingIndicator;
            
            // Clear input
            document.getElementById('question').value = '';
            updateSendButton();
            
            // Scroll to show typing indicator
            document.getElementById('typingIndicator').scrollIntoView({ behavior: 'smooth', block: 'center' });
            
            try {
                const timestamp = new Date().getTime();
                const response = await fetch(`/api.php?q=${encodeURIComponent(question)}&t=${timestamp}`);
                const data = await response.json();
                const result = data.response || 'No response found.';
                
                // Wait 3 seconds for typing indicator
                await new Promise(resolve => setTimeout(resolve, 3000));
                
                // Remove typing indicator
                document.getElementById('typingIndicator').remove();
                
                // Create assistant message container
                const assistantDiv = document.createElement('div');
                assistantDiv.className = 'message assistant';
                container.appendChild(assistantDiv);
                
                // Type out the response word by word
                await typeResponse(assistantDiv, result);
                
                // Scroll to search box smoothly
                searchWrapper.scrollIntoView({ behavior: 'smooth', block: 'center' });
                
                // Focus back on input
                document.getElementById('question').focus();
            } catch (err) {
                // Remove typing indicator on error
                const indicator = document.getElementById('typingIndicator');
                if (indicator) indicator.remove();
                
                container.innerHTML += `<div class="message assistant">Error: ${escapeHtml(err.message)}</div>`;
            }
        }
        
        async function typeResponse(container, text) {
            const formattedHtml = formatResponse(text);
            
            // Create a temporary div to parse the HTML
            const tempDiv = document.createElement('div');
            tempDiv.innerHTML = formattedHtml;
            
            // Type out each element (math is already pre-rendered by KaTeX)
            for (const element of tempDiv.children) {
                await typeElement(container, element);
            }
        }
        
        async function typeElement(container, element) {
            if (element.tagName === 'P') {
                // Type paragraph with HTML formatting preserved
                const p = document.createElement('p');
                container.appendChild(p);
                await typeHTML(p, element.innerHTML);
            } else if (element.tagName === 'UL') {
                // Type list items
                const ul = document.createElement('ul');
                container.appendChild(ul);
                
                for (const li of element.children) {
                    const newLi = document.createElement('li');
                    ul.appendChild(newLi);
                    await typeHTML(newLi, li.innerHTML);
                }
            } else if (element.tagName && element.tagName.match(/^H[1-6]$/)) {
                // Type headers
                const header = document.createElement(element.tagName.toLowerCase());
                container.appendChild(header);
                await typeHTML(header, element.innerHTML);
            } else if (element.tagName === 'PRE') {
                // Type code blocks
                const pre = document.createElement('pre');
                const code = document.createElement('code');
                pre.appendChild(code);
                container.appendChild(pre);
                await typeText(code, element.textContent, 20); // Faster for code
            } else {
                // Default: just add the element
                const newElement = element.cloneNode(true);
                container.appendChild(newElement);
            }
        }
        
        async function typeHTML(element, htmlContent, speed = 80) {
            // Parse HTML content to separate text and tags
            const parts = parseHTMLContent(htmlContent);
            element.classList.add('typewriter', 'typing');
            
            let currentHTML = '';
            
            for (const part of parts) {
                if (part.type === 'text') {
                    // Type text word by word
                    const words = part.content.split(' ');
                    for (let i = 0; i < words.length; i++) {
                        if (i > 0) currentHTML += ' ';
                        currentHTML += words[i];
                        element.innerHTML = currentHTML;
                        await new Promise(resolve => setTimeout(resolve, speed));
                    }
                } else if (part.type === 'tag') {
                    // Add HTML tags instantly
                    currentHTML += part.content;
                    element.innerHTML = currentHTML;
                }
            }
            
            element.classList.remove('typing');
            
            // Small pause between elements
            await new Promise(resolve => setTimeout(resolve, 100));
        }
        
        function parseHTMLContent(html) {
            const parts = [];
            let currentPos = 0;
            
            // Simple approach: split by < and > to separate text and tags
            const segments = html.split(/(<[^>]*>)/);
            
            for (const segment of segments) {
                if (segment.trim()) {
                    if (segment.startsWith('<') && segment.endsWith('>')) {
                        // This is an HTML tag
                        parts.push({ type: 'tag', content: segment });
                    } else {
                        // This is text content
                        parts.push({ type: 'text', content: segment });
                    }
                }
            }
            
            return parts;
        }
        
        async function typeText(element, text, speed = 80) {
            const words = text.split(' ');
            element.classList.add('typewriter', 'typing');
            
            for (let i = 0; i < words.length; i++) {
                element.textContent = words.slice(0, i + 1).join(' ');
                await new Promise(resolve => setTimeout(resolve, speed));
            }
            
            element.classList.remove('typing');
            
            // Small pause between elements
            await new Promise(resolve => setTimeout(resolve, 100));
        }
        
        function escapeHtml(text) {
            const map = {'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;'};
            return text.replace(/[&<>"']/g, m => map[m]);
        }

        // Unified touch/swipe gesture handling for perfectly synchronized dropdown movement
        class DropdownSyncManager {
            constructor() {
                this.touchState = {
                    startX: 0,
                    startY: 0,
                    isTracking: false,
                    isDragging: false,
                    dropdownsVisible: false,
                    animationFrame: null
                };
                this.dropdowns = [];
                this.init();
            }
            
            init() {
                document.addEventListener('touchstart', this.handleTouchStart.bind(this), { passive: false });
                document.addEventListener('touchmove', this.handleTouchMove.bind(this), { passive: false });
                document.addEventListener('touchend', this.handleTouchEnd.bind(this), { passive: false });
            }
            
            getActiveDropdowns() {
                const plusDropdown = document.getElementById('plusDropdown');
                const moreSubmenu = document.getElementById('moreSubmenu');
                
                this.dropdowns = [];
                if (plusDropdown && plusDropdown.classList.contains('show')) {
                    this.dropdowns.push(plusDropdown);
                }
                if (moreSubmenu && moreSubmenu.classList.contains('show')) {
                    this.dropdowns.push(moreSubmenu);
                }
                
                return this.dropdowns.length > 0;
            }
            
            applyTransformToAll(translateX, opacity) {
                // Use requestAnimationFrame for perfectly synchronized updates
                if (this.touchState.animationFrame) {
                    cancelAnimationFrame(this.touchState.animationFrame);
                }
                
                this.touchState.animationFrame = requestAnimationFrame(() => {
                    this.dropdowns.forEach(dropdown => {
                        dropdown.style.transform = `translateX(${translateX}px)`;
                        dropdown.style.opacity = opacity;
                    });
                });
            }
            
            applyTransitionToAll(transition) {
                this.dropdowns.forEach(dropdown => {
                    dropdown.style.transition = transition;
                });
            }
            
            resetAllStyles() {
                this.dropdowns.forEach(dropdown => {
                    dropdown.style.transform = '';
                    dropdown.style.opacity = '';
                    dropdown.style.transition = '';
                });
            }
            
            closeAllDropdowns() {
                const plusDropdown = document.getElementById('plusDropdown');
                const moreSubmenu = document.getElementById('moreSubmenu');
                
                if (plusDropdown) plusDropdown.classList.remove('show');
                if (moreSubmenu) moreSubmenu.classList.remove('show');
            }
            
            handleTouchStart(e) {
                if (this.getActiveDropdowns()) {
                    this.touchState.startX = e.touches[0].clientX;
                    this.touchState.startY = e.touches[0].clientY;
                    this.touchState.isTracking = true;
                    this.touchState.dropdownsVisible = true;
                    this.touchState.isDragging = false;
                    
                    // Reset any previous transforms
                    this.resetAllStyles();
                }
            }
            
            handleTouchMove(e) {
                if (!this.touchState.isTracking || !this.touchState.dropdownsVisible) return;
                
                const currentX = e.touches[0].clientX;
                const currentY = e.touches[0].clientY;
                
                const diffX = this.touchState.startX - currentX;
                const diffY = this.touchState.startY - currentY;
                
                // Check if this is a horizontal swipe (more horizontal than vertical)
                if (Math.abs(diffX) > Math.abs(diffY) && Math.abs(diffX) > 10) {
                    this.touchState.isDragging = true;
                    
                    // Only allow leftward swipe (positive diffX means swiping left)
                    if (diffX > 0) {
                        const translateX = -diffX; // Negative to move left
                        const opacity = Math.max(0, 1 - (diffX / 200)); // Fade out as swiping
                        
                        // Apply synchronized transform to all active dropdowns
                        this.applyTransformToAll(translateX, opacity);
                        
                        // Prevent default scrolling during swipe
                        e.preventDefault();
                    }
                }
            }
            
            handleTouchEnd(e) {
                if (!this.touchState.isTracking) return;
                
                if (this.touchState.isDragging) {
                    const currentX = e.changedTouches[0].clientX;
                    const diffX = this.touchState.startX - currentX;
                    
                    // If swiped far enough left (threshold: 100px), dismiss all dropdowns
                    if (diffX > 100) {
                        // Animate all dropdowns out synchronously
                        this.applyTransitionToAll('transform 0.3s ease-out, opacity 0.3s ease-out');
                        this.applyTransformToAll(-window.innerWidth, 0);
                        
                        // Remove classes after animation
                        setTimeout(() => {
                            this.closeAllDropdowns();
                            this.resetAllStyles();
                        }, 300);
                    } else {
                        // Snap back to original position with synchronized animation
                        this.applyTransitionToAll('transform 0.2s ease-out, opacity 0.2s ease-out');
                        this.applyTransformToAll(0, 1);
                        
                        // Clean up after animation
                        setTimeout(() => {
                            this.dropdowns.forEach(dropdown => {
                                dropdown.style.transition = '';
                            });
                        }, 200);
                    }
                }
                
                // Reset touch state
                this.touchState = {
                    startX: 0,
                    startY: 0,
                    isTracking: false,
                    isDragging: false,
                    dropdownsVisible: false,
                    animationFrame: null
                };
            }
        }

        function formatResponse(text) {
            let html = '';
            const lines = text.split('\n');
            let inList = false;
            let inOrdered = false;
            
            const closeLists = () => {
                if (inList) {
                    html += '</ul>';
                    inList = false;
                }
                if (inOrdered) {
                    html += '</ol>';
                    inOrdered = false;
                }
            };
            
            const renderMathWithKatex = (latex, displayMode = false) => {
                if (typeof katex !== 'undefined') {
                    try {
                        // Clean up the latex string
                        let cleanLatex = latex.trim();
                        // Remove any HTML entities that might have snuck in
                        cleanLatex = cleanLatex.replace(/&amp;/g, '&');
                        
                        return katex.renderToString(cleanLatex, {
                            displayMode: displayMode,
                            throwOnError: false,
                            trust: true,
                            strict: false,
                            output: 'html'
                        });
                    } catch (e) {
                        console.error('KaTeX error:', e, 'LaTeX:', latex);
                        return escapeHtml(latex);
                    }
                }
                return escapeHtml(latex);
            };
            
            const applyBold = (raw) => {
                let processed = raw;
                const mathSegments = [];
                const boldMatches = [];
                
                // Extract inline math $...$ and render with KaTeX
                // Use non-greedy match and handle nested braces better
                processed = processed.replace(/\$([^\$]+?)\$/g, (match, latex) => {
                    const rendered = renderMathWithKatex(latex, false);
                    mathSegments.push(rendered);
                    return `__MATH_${mathSegments.length - 1}__`;
                });
                
                // Process bold markers
                processed = processed.replace(/\*\*([^*]+)\*\*/g, (match, text) => {
                    boldMatches.push(escapeHtml(text));
                    return `__BOLD_${boldMatches.length - 1}__`;
                });
                
                // Escape HTML in non-math content
                processed = escapeHtml(processed);
                
                // Restore bold
                processed = processed.replace(/__BOLD_(\d+)__/g, (match, index) => {
                    return `<strong>${boldMatches[index]}</strong>`;
                });
                
                // Restore math segments (already rendered as HTML)
                processed = processed.replace(/__MATH_(\d+)__/g, (match, index) => {
                    return mathSegments[index];
                });
                
                return processed;
            };
            
            const splitTableRow = (row) => {
                return row.replace(/^\||\|$/g, '').split('|').map(cell => cell.trim());
            };

            const convertLatexToPlain = (eq, { asHtml = false, preserveLatex = false } = {}) => {
                // If preserveLatex is true, return the LaTeX as-is for MathJax rendering
                if (preserveLatex) {
                    return eq;
                }
                
                let s = eq;
                // Remove LaTeX block/inline markers
                s = s.replace(/\$\$/g, '').replace(/\$/g, '');
                // Common operator and wrapper replacements (match single or double backslashes)
                s = s.replace(/\\{1,2}left\s*\(/g, '(').replace(/\\{1,2}right\s*\)/g, ')');
                s = s.replace(/\\{1,2}cdot/g, ' · ');
                s = s.replace(/\\{1,2}times/g, ' × ');
                s = s.replace(/\\{1,2}approx/g, ' ≈ ');
                s = s.replace(/\\{1,2}nabla/g, '∇');
                s = s.replace(/\\{1,2}partial/g, '∂');
                s = s.replace(/\\{1,2}sqrt/g, '√');
                s = s.replace(/\\{1,2}mathbf\{([^}]*)\}/g, '$1');
                s = s.replace(/\\{1,2}mathbf\{([^}]*)\}/g, '$1');
                s = s.replace(/\\{1,2}mathbf\s*([A-Za-z])/g, '$1');
                s = s.replace(/\\{1,2}boldsymbol\{([^}]*)\}/g, '$1');
                s = s.replace(/\\{1,2}mathrm\{([^}]*)\}/g, '$1');
                s = s.replace(/\\{1,2}text\{([^}]*)\}/g, '$1');
                s = s.replace(/\\{1,2}frac\{([^}]*)\}\{([^}]*)\}/g, '($1)/($2)');
                // \mathcal variants (common: \mathcal{L}, occasionally mistyped as \mathcalL)
                s = s.replace(/\\{1,2}mathcal\{([A-Za-z])\}/g, (m, ch) => {
                    const map = { 'A':'𝓐','B':'𝓑','C':'𝓒','D':'𝓓','E':'𝓔','F':'𝓕','G':'𝓖','H':'𝓗','I':'𝓘','J':'𝓙','K':'𝓚','L':'𝓛','M':'𝓜','N':'𝓝','O':'𝓞','P':'𝓟','Q':'𝓠','R':'𝓡','S':'𝓢','T':'𝓣','U':'𝓤','V':'𝓥','W':'𝓦','X':'𝓧','Y':'𝓨','Z':'𝓩' };
                    return map[ch] || ch;
                });
                s = s.replace(/\\{1,2}mathcal\s*([A-Za-z])/g, (m, ch) => ch === 'L' ? '𝓛' : ch);
                // Greek letters (common set)
                const greek = {
                    alpha: 'α', beta: 'β', gamma: 'γ', Gamma: 'Γ', delta: 'δ', Delta: 'Δ',
                    epsilon: 'ε', zeta: 'ζ', eta: 'η', theta: 'θ', Theta: 'Θ', iota: 'ι',
                    kappa: 'κ', lambda: 'λ', Lambda: 'Λ', mu: 'μ', nu: 'ν', xi: 'ξ', Xi: 'Ξ',
                    pi: 'π', Pi: 'Π', rho: 'ρ', sigma: 'σ', Sigma: 'Σ', tau: 'τ',
                    phi: 'φ', Phi: 'Φ', chi: 'χ', psi: 'ψ', Psi: 'Ψ', omega: 'ω', Omega: 'Ω'
                };
                const greekVar = { varepsilon: 'ε', varphi: 'φ', vartheta: 'ϑ', varrho: 'ρ', varsigma: 'ς', varpi: 'ϖ' };
                for (const [name, char] of Object.entries(greek)) {
                    const re = new RegExp('\\\\{1,2}' + name, 'g');
                    s = s.replace(re, char);
                }
                for (const [name, char] of Object.entries(greekVar)) {
                    const re = new RegExp('\\\\{1,2}' + name, 'g');
                    s = s.replace(re, char);
                }
                // Hats on single letters: \hat n -> n̂, \hat{n} -> n̂
                s = s.replace(/\\{1,2}hat\s*\{?\s*([a-zA-Z])\s*\}?/g, (m, p1) => p1 + '\u0302');
                // Subscripts and superscripts for digits and common letters
                const subDigits = { '0':'₀','1':'₁','2':'₂','3':'₃','4':'₄','5':'₅','6':'₆','7':'₇','8':'₈','9':'₉' };
                const subLetters = { 'a':'ₐ','e':'ₑ','h':'ₕ','i':'ᵢ','j':'ⱼ','k':'ₖ','l':'ₗ','m':'ₘ','n':'ₙ','o':'ₒ','p':'ₚ','r':'ᵣ','s':'ₛ','t':'ₜ','u':'ᵤ','v':'ᵥ','x':'ₓ' };
                const supDigits = { '0':'⁰','1':'¹','2':'²','3':'³','4':'⁴','5':'⁵','6':'⁶','7':'⁷','8':'⁸','9':'⁹' };
                const supExtras = { '+':'⁺','-':'⁻','(':'⁽',')':'⁾','/':'⁄' };
                const toSubscript = (str) => str.split('').map(ch => subDigits[ch] || subLetters[ch] || ch).join('');
                const toSuperscript = (str) => str.split('').map(ch => supDigits[ch] || supExtras[ch] || ch).join('');
                // Sub/Sup handling: use HTML in math blocks for broader character support
                if (asHtml) {
                    s = s.replace(/_\{\s*([^}]+)\s*\}/g, (m, inner) => `<sub>${inner.trim()}</sub>`);
                    s = s.replace(/_([A-Za-z0-9]+)/g, (m, seq) => `<sub>${seq}</sub>`);
                    s = s.replace(/\^\{\s*([^}]+)\s*\}/g, (m, inner) => `<sup>${inner.trim()}</sup>`);
                    s = s.replace(/\^([A-Za-z0-9]+)/g, (m, seq) => `<sup>${seq}</sup>`);
                } else {
                    s = s.replace(/_\{\s*([^}]+)\s*\}/g, (m, inner) => toSubscript(inner.trim()));
                    s = s.replace(/_([A-Za-z0-9])/g, (m, ch) => toSubscript(ch));
                    s = s.replace(/\^\{\s*([^}]+)\s*\}/g, (m, inner) => toSuperscript(inner.trim()));
                    s = s.replace(/\^([0-9])/g, (m, d) => toSuperscript(d));
                }
                // Cleanup braces remnants
                s = s.replace(/\{\s*/g, '').replace(/\s*\}/g, '');
                // Collapse spaces
                s = s.replace(/\s+/g, ' ').trim();
                return s;
            };
            
            const convertInlineLatexSegments = (line) => {
                // Replace any $...$ inline segments with plain conversion and strip stray $
                let out = line.replace(/\$(.*?)\$/g, (m, inner) => convertLatexToPlain(inner));
                out = out.replace(/\$/g, '');
                // Also handle simple inline commands even without $ wrappers
                if (/\\[A-Za-z]+/.test(out) || /[_\^]/.test(out)) {
                    out = convertLatexToPlain(out);
                }
                return out;
            };
            
            for (let i = 0; i < lines.length; i++) {
                const line = lines[i];
                const trimmed = line.trim();
                
                // Table detection: header line with pipes followed by separator line
                const nextLine = lines[i + 1] ? lines[i + 1].trim() : '';
                if (trimmed.includes('|') && nextLine && nextLine.match(/^\|?\s*:?-{2,}.*\|.*$/)) {
                    closeLists();
                    const headers = splitTableRow(trimmed);
                    const rows = [];
                    let j = i + 2;
                    while (j < lines.length && lines[j].includes('|')) {
                        rows.push(splitTableRow(lines[j]));
                        j++;
                    }
                    html += '<table class="response-table">';
                    html += '<thead><tr>' + headers.map(h => `<th>${applyBold(h)}</th>`).join('') + '</tr></thead>';
                    if (rows.length) {
                        html += '<tbody>' + rows.map(r => '<tr>' + r.map(c => `<td>${applyBold(c)}</td>`).join('') + '</tr>').join('') + '</tbody>';
                    }
                    html += '</table>';
                    i = j - 1;
                    continue;
                }
                
                // Math block detection: $$ markers on their own lines
                if (trimmed === '$$') {
                    closeLists();
                    let j = i + 1;
                    let blockContent = '';
                    while (j < lines.length && lines[j].trim() !== '$$') {
                        blockContent += (blockContent ? '\n' : '') + lines[j];
                        j++;
                    }
                    // Render with KaTeX immediately
                    const rendered = renderMathWithKatex(blockContent, true);
                    html += `<div class="math-block">${rendered}</div>`;
                    i = j; // skip closing $$
                    continue;
                }

                if (trimmed.match(/^#{1,6}\s/)) {
                    closeLists();
                    const level = trimmed.match(/^#+/)[0].length;
                    const content = trimmed.replace(/^#+\s/, '');
                    html += `<h${level}>${escapeHtml(content)}</h${level}>`;
                } else if (trimmed.startsWith('- ') || trimmed.startsWith('* ')) {
                    if (inOrdered) {
                        html += '</ol>';
                        inOrdered = false;
                    }
                    if (!inList) {
                        html += '<ul>';
                        inList = true;
                    }
                    const content = trimmed.substring(2);
                    html += `<li>${applyBold(content)}</li>`;
                } else if (trimmed.startsWith('1. ') || trimmed.match(/^\d+\.\s/)) {
                    if (inList) {
                        html += '</ul>';
                        inList = false;
                    }
                    if (!inOrdered) {
                        html += '<ol>';
                        inOrdered = true;
                    }
                    const content = trimmed.replace(/^\d+\.\s/, '');
                    html += `<li>${applyBold(content)}</li>`;
                } else if (trimmed.startsWith('```')) {
                    closeLists();
                    const lang = trimmed.substring(3);
                    let code = '';
                    let j = i + 1;
                    while (j < lines.length && !lines[j].trim().startsWith('```')) {
                        code += lines[j] + '\n';
                        j++;
                    }
                    i = j; // Skip processed lines
                    html += `<pre><code class="language-${escapeHtml(lang)}">${escapeHtml(code.trim())}</code></pre>`;
                } else if (trimmed.startsWith('$$') || trimmed.startsWith('$')) {
                    // Inline or single-line math
                    closeLists();
                    if (trimmed.startsWith('$$')) {
                        const latex = trimmed.replace(/^\$\$|\$\$$/g, '');
                        const rendered = renderMathWithKatex(latex, true);
                        html += `<div class="math-block">${rendered}</div>`;
                    } else {
                        html += `<p>${applyBold(trimmed)}</p>`;
                    }
                } else if (trimmed) {
                    closeLists();
                    // Let MathJax handle all math rendering
                    html += `<p>${applyBold(trimmed)}</p>`;
                } else {
                    closeLists();
                }
            }
            
            closeLists();
            return html;
        }
        
        // Toggle send arrow and voice button sharing the same position
        const qInput = document.getElementById('question');
        const sendBtn = document.getElementById('sendBtn');
        const voiceBtn = document.querySelector('.voice-btn');
        function updateSendButton() {
            if (!sendBtn || !voiceBtn) return;
            const hasText = qInput.value.trim().length > 0;
            sendBtn.style.display = hasText ? 'flex' : 'none';
            voiceBtn.style.display = hasText ? 'none' : 'flex';
        }
        qInput.addEventListener('input', updateSendButton);
        qInput.addEventListener('keyup', updateSendButton);
        qInput.addEventListener('change', updateSendButton);
        updateSendButton();
        
        qInput.focus();
    </script>
</body>
</html>
