<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Google tag (gtag.js) -->

    <script>
      window.dataLayer = window.dataLayer || [];

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chip Foundry Services</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #0a0a0a;
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem;
        }
        .header { text-align: center; margin-bottom: 2rem; }
        h1 { font-size: clamp(2rem, 8vw, 3.5rem); font-weight: 300; letter-spacing: -0.02em; margin-bottom: 1rem; }
        h1 strong { font-weight: 600; }
        .subtitle { font-size: clamp(0.9rem, 2.5vw, 1.2rem); color: #666; max-width: 600px; line-height: 1.6; }
        .chat-container { width: 100%; max-width: 800px; flex: 1; display: flex; flex-direction: column; }
        .messages { flex: 1; overflow-y: auto; padding: 1rem 0; display: flex; flex-direction: column; gap: 1.5rem; }
        .message { display: flex; gap: 1rem; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .message.user { flex-direction: row-reverse; }
        .avatar { width: 32px; height: 32px; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 14px; flex-shrink: 0; margin-top: 4px; }
        .message.assistant .avatar { background: linear-gradient(135deg, #10a37f, #1a7f64); color: #fff; }
        .message.user .avatar { background: #5436da; color: #fff; }
        .content { max-width: 85%; }
        .message.user .content { background: #2f2f2f; padding: 0.875rem 1.25rem; border-radius: 18px 18px 4px 18px; color: #fff; }
        .message.assistant .content { color: #d1d5db; line-height: 1.8; }
        
        /* Paragraph styling */
        .message.assistant .content p {
            margin-bottom: 1rem;
        }
        .message.assistant .content p:last-child {
            margin-bottom: 0;
        }
        
        /* Section headers */
        .message.assistant .content .section {
            margin-bottom: 1.25rem;
        }
        .message.assistant .content .section-header {
            color: #10a37f;
            font-weight: 600;
            font-size: 0.95rem;
            margin-bottom: 0.5rem;
            display: block;
        }
        .message.assistant .content .section-body {
            color: #d1d5db;
        }
        
        /* Numbered steps */
        .message.assistant .content .step {
            display: flex;
            gap: 0.75rem;
            margin: 0.75rem 0;
            padding: 0.875rem 1rem;
            background: #151515;
            border-radius: 8px;
            border-left: 3px solid #10a37f;
        }
        .message.assistant .content .step-num {
            color: #10a37f;
            font-weight: 700;
            flex-shrink: 0;
            min-width: 20px;
        }
        
        /* Highlights */
        .message.assistant .content .hl { color: #fff; font-weight: 500; }
        .message.assistant .content .tech { color: #10a37f; }
        
        /* Tip box */
        .message.assistant .content .tip {
            margin-top: 1rem;
            padding: 1rem;
            background: linear-gradient(135deg, #0d1a14, #151a1f);
            border-radius: 8px;
            border: 1px solid #1a3028;
            font-size: 0.9rem;
        }
        .message.assistant .content .tip-icon { margin-right: 0.5rem; }
        
        /* Typing indicator */
        .typing-indicator { display: flex; gap: 4px; padding: 0.5rem 0; }
        .typing-indicator span { width: 8px; height: 8px; background: #555; border-radius: 50%; animation: bounce 1.4s infinite ease-in-out; }
        .typing-indicator span:nth-child(1) { animation-delay: 0s; }
        .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
        .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes bounce { 0%, 80%, 100% { transform: scale(0.8); opacity: 0.5; } 40% { transform: scale(1); opacity: 1; } }
        
        /* Input area */
        .input-area { padding: 1.5rem 0; position: sticky; bottom: 0; background: linear-gradient(transparent, #0a0a0a 20%); }
        .input-wrapper { position: relative; background: #1a1a1a; border: 1px solid #333; border-radius: 24px; padding: 0.5rem; display: flex; align-items: center; transition: border-color 0.2s, box-shadow 0.2s; }
        .input-wrapper:focus-within { border-color: #10a37f; box-shadow: 0 0 0 2px rgba(16, 163, 127, 0.1); }
        .input-wrapper input { flex: 1; padding: 0.75rem 1rem; font-size: 1rem; border: none; background: transparent; color: #fff; outline: none; }
        .input-wrapper input::placeholder { color: #555; }
        .send-btn { width: 40px; height: 40px; border-radius: 50%; border: none; background: #333; color: #555; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.2s; opacity: 0.5; }
        .send-btn.active { background: #10a37f; color: #fff; opacity: 1; }
        .send-btn.active:hover { background: #0d8c6d; transform: scale(1.05); }
        .send-btn svg { width: 18px; height: 18px; }
        
        /* Welcome */
        .welcome { text-align: center; color: #555; padding: 3rem 1rem; }
        .welcome h2 { font-size: 1.5rem; font-weight: 400; color: #888; margin-bottom: 1rem; }
        .suggestions { display: flex; flex-wrap: wrap; gap: 0.5rem; justify-content: center; margin-top: 1.5rem; }
        .suggestion { padding: 0.5rem 1rem; background: #1a1a1a; border: 1px solid #333; border-radius: 20px; color: #888; font-size: 0.875rem; cursor: pointer; transition: all 0.2s; }
        .suggestion:hover { border-color: #10a37f; color: #fff; }
    </style>
</head>
<body>
    <div class="header">
        <h1><strong>AI Factory</strong></h1>
        <p class="subtitle">Chip Design → Wafer Foundry → LLM Pre-Train → Fine-Tune → Inference</p>
    </div>

    <div class="chat-container">
        <div class="messages" id="messages">
            <div class="welcome" id="welcome">
                <h2>How can I help you today?</h2>
                <p>Ask me anything about chip design, semiconductor manufacturing, or AI</p>
                <div class="suggestions">
                    <span class="suggestion" onclick="askSuggestion(this)">How to make a chip?</span>
                    <span class="suggestion" onclick="askSuggestion(this)">What is photolithography?</span>
                    <span class="suggestion" onclick="askSuggestion(this)">Explain LLM training</span>
                    <span class="suggestion" onclick="askSuggestion(this)">TSMC vs Intel</span>
                </div>
            </div>
        </div>

        <div class="input-area">
            <div class="input-wrapper">
                <input type="text" id="question" placeholder="Ask anything..." oninput="toggleBtn()" onkeypress="if(event.key==='Enter')ask()">
                <button class="send-btn" id="sendBtn" onclick="ask()">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 19V5M5 12l7-7 7 7"/>
                    </svg>
                </button>
            </div>
        </div>
    </div>

    <script>
        function toggleBtn() {
            const input = document.getElementById('question');
            const btn = document.getElementById('sendBtn');
            btn.classList.toggle('active', input.value.trim().length > 0);
        }

        function askSuggestion(el) {
            document.getElementById('question').value = el.textContent;
            toggleBtn();
            ask();
        }

        function formatResponse(text) {
            // Clean escaped newlines
            text = text.replace(/\\n/g, '\n').replace(/\\r/g, '');
            
            let html = '';
            
            // Check for numbered steps pattern: 1) or Step 1:
            if (/\d+\)\s/.test(text)) {
                const parts = text.split(/(?=\d+\)\s)/);
                let intro = '';
                
                parts.forEach(part => {
                    part = part.trim();
                    if (!part) return;
                    
                    const stepMatch = part.match(/^(\d+)\)\s*(.+)/s);
                    if (stepMatch) {
                        html += `<div class="step"><span class="step-num">${stepMatch[1]}.</span><span>${highlight(stepMatch[2])}</span></div>`;
                    } else {
                        intro = part;
                    }
                });
                
                if (intro) {
                    html = `<p>${highlight(intro)}</p>` + html;
                }
                
                return addTip(html, text);
            }
            
            // Check for section headers: "Pre-training:", "Fine-tuning:", etc.
            const sectionKeywords = ['Pre-training', 'Fine-tuning', 'Pre-train', 'Fine-tune', 
                'Key concepts', 'Key technical', 'Methods', 'Process', 'Steps', 'Summary',
                'Phase 1', 'Phase 2', 'First', 'Second', 'Third'];
            
            let hasSections = sectionKeywords.some(kw => text.includes(kw + ':'));
            
            if (hasSections) {
                // Split by section headers
                const regex = new RegExp(`(${sectionKeywords.join('|')}):\\s*`, 'g');
                const parts = text.split(regex);
                
                for (let i = 0; i < parts.length; i++) {
                    const part = parts[i].trim();
                    if (!part) continue;
                    
                    if (sectionKeywords.includes(part)) {
                        // This is a header, next part is content
                        const content = parts[i + 1] ? parts[i + 1].trim() : '';
                        html += `<div class="section"><span class="section-header">${part}</span><span class="section-body">${highlight(content)}</span></div>`;
                        i++;
                    } else if (i === 0) {
                        // Intro before first section
                        html += `<p>${highlight(part)}</p>`;
                    }
                }
                
                return addTip(html, text);
            }
            
            // Default: split into paragraphs by sentences
            const sentences = text.split(/(?<=[.!?])\s+/);
            let paragraphs = [];
            let current = [];
            
            sentences.forEach((s, i) => {
                current.push(s);
                if (current.length >= 2 || i === sentences.length - 1) {
                    paragraphs.push(current.join(' '));
                    current = [];
                }
            });
            
            paragraphs.forEach(p => {
                html += `<p>${highlight(p)}</p>`;
            });
            
            return addTip(html, text);
        }

        function highlight(text) {
            if (!text) return '';
            
            // Technical terms
            const terms = ['GPU', 'GPUs', 'TPU', 'CPU', 'FPGA', 'LLM', 'LLMs', 'AI', 'ML', 
                'EUV', 'UV', 'DUV', 'ASML', 'TSMC', 'Intel', 'Samsung', 'AMD', 'NVIDIA',
                'SFT', 'RLHF', 'DPO', 'PPO', 'FP16', 'BF16', 'DDP', 'FSDP', 'BPE',
                'SentencePiece', 'Transformer', 'GPT', 'BERT', 'LoRA', 'QLoRA'];
            
            let result = text;
            
            // Escape HTML first
            result = result.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
            
            // Highlight numbers with units
            result = result.replace(/(\d+[-–]?\d*\s*(?:nm|GB|TB|MB|tokens?|layers?|parameters?))/gi, '<span class="hl">$1</span>');
            
            // Highlight big numbers
            result = result.replace(/(billions?|trillions?|millions?|thousands?)/gi, '<span class="hl">$1</span>');
            
            // Highlight tech terms
            terms.forEach(term => {
                const re = new RegExp(`\\b(${term})\\b`, 'g');
                result = result.replace(re, '<span class="tech">$1</span>');
            });
            
            return result;
        }

        function addTip(html, originalText) {
            const tipPhrases = ['for hobbyist', 'try ', 'tip:', 'look up', 'you can also', 'alternatively'];
            const lower = originalText.toLowerCase();
            
            for (const phrase of tipPhrases) {
                const idx = lower.lastIndexOf(phrase);
                if (idx > lower.length * 0.6) {
                    // Found a tip near the end - it's already in the HTML, style would need DOM manipulation
                    // For now, return as-is
                    break;
                }
            }
            return html;
        }

        function addMessage(role, content, isTyping = false) {
            const welcome = document.getElementById('welcome');
            if (welcome) welcome.remove();
            
            const messages = document.getElementById('messages');
            const div = document.createElement('div');
            div.className = `message ${role}`;
            
            const avatar = role === 'assistant' ? '✦' : '👤';
            
            if (isTyping) {
                div.innerHTML = `<div class="avatar">${avatar}</div><div class="content"><div class="typing-indicator"><span></span><span></span><span></span></div></div>`;
                div.id = 'typing';
            } else if (role === 'user') {
                const escaped = content.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                div.innerHTML = `<div class="avatar">${avatar}</div><div class="content">${escaped}</div>`;
            } else {
                div.innerHTML = `<div class="avatar">${avatar}</div><div class="content">${formatResponse(content)}</div>`;
            }
            
            messages.appendChild(div);
            messages.scrollTop = messages.scrollHeight;
        }

        function isEtchProfileQuery(q) {
            const s = q.toLowerCase();
            return s.includes('etch profile modeling') || s.includes('etch profile');
        }

        function formatAsciiIfPresent(text) {
            const asciiChars = ['┌','└','┴','┬','│','─','↓'];
            if (asciiChars.some(ch => text.includes(ch))) {
                const escaped = text.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                return `<pre>${escaped}</pre>`;
            }
            return formatResponse(text);
        }

        async function ask() {
            const input = document.getElementById('question');
            const q = input.value.trim();
            if (!q) return;
            
            addMessage('user', q);
            input.value = '';
            toggleBtn();
            
            addMessage('assistant', '', true);
            
            try {
                let content = '';
                if (isEtchProfileQuery(q)) {
                    const raw = await fetch('/raw_response.php?id=10728');
                    const data = await raw.json();
                    content = data.response || '';
                    document.getElementById('typing')?.remove();
                    const messages = document.getElementById('messages');
                    const div = document.createElement('div');
                    div.className = 'message assistant';
                    const escaped = content.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    div.innerHTML = `<div class="avatar">✦</div><div class="content"><pre>${escaped}</pre></div>`;
                    messages.appendChild(div);
                    messages.scrollTop = messages.scrollHeight;
                } else {
                    const res = await fetch('/api.php?q=' + encodeURIComponent(q));
                    const data = await res.json();
                    document.getElementById('typing')?.remove();
                    // Use ASCII-preserving renderer when diagram characters present
                    const html = formatAsciiIfPresent(data.response || '');
                    const messages = document.getElementById('messages');
                    const div = document.createElement('div');
                    div.className = 'message assistant';
                    div.innerHTML = `<div class="avatar">✦</div><div class="content">${html}</div>`;
                    messages.appendChild(div);
                    messages.scrollTop = messages.scrollHeight;
                }
            } catch (err) {
                document.getElementById('typing')?.remove();
                addMessage('assistant', 'Sorry, I encountered an error. Please try again.');
            }
        }
    </script>
</body>
</html>
